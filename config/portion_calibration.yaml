# WasteWiseAI Portion Calibration & Economic Parameters
# Used for converting detected pixel area to estimated leftover grams,
# tracking inventory economics, shelf lives, and bin thresholds.

plate_reference:
  standard_diameter_cm: 26.0
  area_cm2: 530.93
  empty_threshold_ratio: 0.06      # <6% food coverage is deemed empty plate
  partial_threshold_ratio: 0.60    # 6%-60% is partial leftover; >60% is full untouched plate

